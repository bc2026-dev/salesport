<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="営業は環境の組み合わせで何通りにもなる。6つの質問から、自分に合う営業スタイルと求人の選択肢を確認できます。">
  <meta property="og:title" content="SalesPort｜営業キャリアの選択肢">
  <meta property="og:description" content="営業キャリアに、新しい行き先を。">
  <meta property="og:image" content="og.png">
  <title>SalesPort｜営業キャリアの選択肢</title>
  <style>
    :root{--navy:#102c49;--blue:#147dba;--cyan:#35bfd0;--ink:#18324b}
    *{box-sizing:border-box}html{background:#eaf1f5;scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fff;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,a{font:inherit}button{color:inherit}.page{width:min(100%,480px);min-height:100vh;margin:0 auto;overflow:hidden;background:#fff;box-shadow:0 0 32px rgba(17,48,74,.1)}
    .hero{position:relative;width:100%;line-height:0}.hero img{display:block;width:100%;height:auto}
    .check-area{position:relative;z-index:2;margin-top:-24px;padding:0 14px 46px}.check-card{min-height:424px;overflow:hidden;border:1px solid rgba(20,125,186,.12);border-radius:25px;background:rgba(255,255,255,.98);box-shadow:0 18px 40px rgba(19,67,98,.18)}.start-block{padding:45px 22px 38px;text-align:center;animation:appear .3s ease both}.start-label{margin:0 0 10px;color:#1b94b0;font-size:10px;font-weight:900;letter-spacing:.15em}.start-block h2{margin:0;color:var(--navy);font-size:22px;line-height:1.55;font-weight:900}.start-description{margin:13px 0 24px;color:#607b8b;font-size:12px;line-height:1.8}.start-button{display:flex;width:100%;min-height:66px;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 22px rgba(20,125,186,.25);transition:.18s ease}.start-button:hover,.start-button:focus-visible{transform:translateY(-1px);outline:none}.start-button span{padding:4px 6px;border-radius:5px;background:#fff;color:#1189a5;font-size:10px}.start-button b{font-size:14px}.start-button i{font-size:24px;font-style:normal}.check-head{padding:19px 22px 0}.step-line{display:flex;align-items:center;justify-content:space-between;color:#608299;font-size:11px;font-weight:800}.step-line span{color:#16819b}.step-line b{letter-spacing:.08em}.progress{height:5px;margin-top:10px;overflow:hidden;border-radius:20px;background:#e6f0f4}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .3s ease}
    .question-block{padding:25px 22px 23px;animation:appear .28s ease both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.question-kicker,.result-label{margin:0 0 8px;color:#1b94b0;font-size:10px;font-weight:900;letter-spacing:.15em}.question-block h2{margin:0;color:var(--navy);font-size:21px;line-height:1.55;font-weight:900}.question-caption{margin:6px 0 17px;color:#718794;font-size:12px}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option-grid button{display:flex;align-items:center;justify-content:space-between;min-height:67px;padding:10px 10px 10px 13px;border:1.5px solid #d7e6ec;border-radius:13px;background:#fff;text-align:left;cursor:pointer;transition:.18s ease}.option-grid button:hover,.option-grid button:focus-visible{border-color:var(--cyan);background:#f1fbfd;transform:translateY(-1px);outline:none}.option-grid button span{font-size:12px;font-weight:750;line-height:1.45}.option-grid button i{display:grid;flex:0 0 24px;width:24px;height:24px;place-items:center;border-radius:50%;background:#edf8fb;color:#1189a5;font-size:21px;font-style:normal;line-height:1}.back-button,.restart-button{display:block;margin:15px auto 0;border:0;background:transparent;color:#6f8592;font-size:11px;text-decoration:underline;cursor:pointer}
    .result-block{display:none;padding:34px 21px 26px;text-align:center;animation:appear .35s ease both}.result-block h2{margin:0;color:var(--navy);font-size:23px;line-height:1.55;font-weight:750}.result-block h2 strong{color:#087f9e;font-weight:900}.result-block>p:not(.result-label){margin:13px 0 0;color:#537081;font-size:12px;line-height:1.85}.answer-summary{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:19px 0 21px}.answer-summary span{padding:6px 9px;border-radius:999px;background:#edf8fb;color:#167b96;font-size:10px;font-weight:800}.line-button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:61px;padding:12px 18px;border-radius:15px;background:linear-gradient(135deg,#13b955,#05a846);color:#fff;font-size:15px;font-weight:900;text-decoration:none;box-shadow:0 10px 22px rgba(7,168,70,.24)}.line-button span{padding:3px 5px;border-radius:4px;background:#fff;color:#08a748;font-size:11px}.line-button i{margin-left:2px;font-size:25px;font-style:normal}.result-block small{display:block;margin-top:10px;color:#6f8592;font-size:9px}
    footer{padding:35px 22px 31px;background:#fff;text-align:center}footer img{width:74px;height:52px;object-fit:cover;mix-blend-mode:multiply}footer p{margin:8px 0 15px;color:#536b79;font-size:11px;font-weight:700}footer nav{display:flex;justify-content:center;gap:13px}footer a{color:#71848f;font-size:9px}footer small{display:block;margin-top:18px;color:#9aaab3;font-size:8px}
    @media(max-width:350px){.question-block{padding-inline:17px}.option-grid button span{font-size:11px}}
  </style>
</head>
<body>
<main class="page">
  <section class="hero" aria-label="営業キャリアに、新しい行き先を。">
    <img src="salesport-fv.png" alt="営業キャリアに、新しい行き先を。">
  </section>

  <section class="check-area" aria-label="営業キャリア選択肢チェック">
    <div class="check-card">
      <div class="start-block" id="startBlock">
        <p class="start-label">SALES STYLE CHECK</p>
        <h2>あなたに合う営業環境を<br>見つけてみませんか？</h2>
        <p class="start-description">6つの質問から、今のあなたが大切にしたい<br>営業スタイルを整理できます。</p>
        <button class="start-button" id="startButton" type="button"><span>簡単1分</span><b>営業スタイル診断をはじめる</b><i>›</i></button>
      </div>

      <div id="questionArea" style="display:none">
        <div class="check-head">
          <div class="step-line"><span>簡単1分</span><b id="stepNumber">1 / 6</b></div>
          <div class="progress"><span id="progressBar" style="width:16.67%"></span></div>
        </div>
        <div class="question-block" id="questionBlock">
          <p class="question-kicker" id="questionKicker">QUESTION 1</p>
          <h2 id="questionTitle"></h2>
          <p class="question-caption" id="questionCaption"></p>
          <div class="option-grid" id="optionGrid"></div>
          <button class="back-button" id="backButton" type="button" style="display:none">← 前の質問に戻る</button>
        </div>
      </div>

      <div class="result-block" id="resultBlock">
        <p class="result-label">ご回答ありがとうございました！⚓</p>
        <h2>あなたの希望の環境が、<br><strong>明確になりましたね。</strong></h2>
        <div class="answer-summary" id="answerSummary"></div>
        <a class="line-button" id="lineButton" href="https://lin.ee/Qye5J9U"><span>LINEで</span> 募集中の会社を見てみる <i>›</i></a>
        <small>無料・1分アンケート／転職時期が未定でも大丈夫です</small>
        <button class="restart-button" id="restartButton" type="button">最初からやり直す</button>
      </div>
    </div>
  </section>

  <footer>
    <nav><a href="privacy.html">個人情報等の取扱い</a></nav>
    <small>© Bitters Club株式会社</small>
  </footer>
</main>

<script>
  /* ============================================================
   * SalesPort 設定値
   * META_PIXEL_ID は最終検証時にデータセットIDを入力します。
   * 空欄の間はMetaピクセルを読み込まず、イベントも送信しません。
   * ============================================================ */
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyOtZPu-LcgJAFOFzhRpmr_nmJ_N4IVHHiuMNEZxaNyLp4YtCqrtO8uJMItUbDTnfkLJg/exec";
  const LINE_FRIEND_URL = "https://lin.ee/Qye5J9U";
  const META_PIXEL_ID = "1038125212459423";

  const questions = [
    {title:"今の営業で、一番変えたいことは？",caption:"直感に近いものを選んでください",options:["年収・評価","商材・お客様(法人/個人)","働き方","まだ分からない"]},
    {title:"どんな顧客との関わり方が理想ですか？",caption:"一番近いものを選んでください",options:["多くのお客様と接点を持つ","一社一社と深く向き合う","両方をバランスよく","相談して考えたい"]},
    {title:"どんな営業活動が合いそうですか？",caption:"経験ではなく希望で大丈夫です",options:["新しい顧客を開拓する","既存顧客を支援する","問い合わせに対応する","まだ分からない"]},
    {title:"どんな評価を大切にしたいですか？",caption:"今の気持ちに近いものを選んでください",options:["成果が明確に評価される","行動も評価される","安定して積み上げられる","相談しながら考えたい"]},
    {title:"希望する働き方に近いものは？",caption:"現時点の希望で大丈夫です",options:["近い職場で働きたい","メリハリをつけたい","時間の柔軟性を重視","特に決まっていない"]},
    {title:"次のキャリアで優先したいことは？",caption:"一番近いものを選んでください",options:["収入を上げたい","成長できる環境","無理なく長く働きたい","自分に合う選択肢を知りたい"]}
  ];

  let step = 0;
  let answers = [];
  let surveyStartedAt = "";
  let surveyCompletedAt = "";
  let diagnosisEventSent = false;
  let diagnosisStartEventSent = false;
  let gaAnsweredSteps = new Set();
  let ctaSending = false;

  const landingTime = new Date().toISOString();
  const query = new URLSearchParams(location.search);
  const clickId = getOrCreateClickId();

  const questionArea = document.getElementById("questionArea");
  const startBlock = document.getElementById("startBlock");
  const startButton = document.getElementById("startButton");
  const questionBlock = document.getElementById("questionBlock");
  const resultBlock = document.getElementById("resultBlock");
  const title = document.getElementById("questionTitle");
  const caption = document.getElementById("questionCaption");
  const kicker = document.getElementById("questionKicker");
  const grid = document.getElementById("optionGrid");
  const stepNumber = document.getElementById("stepNumber");
  const progressBar = document.getElementById("progressBar");
  const backButton = document.getElementById("backButton");
  const answerSummary = document.getElementById("answerSummary");
  const lineButton = document.getElementById("lineButton");

  lineButton.href = LINE_FRIEND_URL;

  initializeMetaPixel();

  function initializeMetaPixel(){
    const pixelId = String(META_PIXEL_ID || "").trim();
    if(!pixelId || pixelId.toLowerCase() === "null") return;

    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', pixelId);
    fbq('track', 'PageView');
  }

  function trackMetaCustom(eventName, parameters){
    if(typeof window.fbq !== "function") return;
    window.fbq('trackCustom', eventName, parameters || {});
  }

  function trackGaEvent(eventName, parameters){
    if(typeof window.gtag !== "function") return;
    window.gtag('event', eventName, parameters || {});
  }

  function getOrCreateClickId(){
    const key = "salesport_click_id";
    try{
      const existing = sessionStorage.getItem(key);
      if(existing) return existing;
      const generated = createUniqueId();
      sessionStorage.setItem(key, generated);
      return generated;
    }catch(error){
      return createUniqueId();
    }
  }

  function createUniqueId(){
    if(window.crypto && typeof window.crypto.randomUUID === "function"){
      return window.crypto.randomUUID();
    }
    return "sp_" + Date.now() + "_" + Math.random().toString(36).slice(2,12);
  }

  function getCookie(name){
    const prefix = name + "=";
    const parts = document.cookie ? document.cookie.split(";") : [];
    for(const part of parts){
      const value = part.trim();
      if(value.indexOf(prefix) === 0){
        return decodeURIComponent(value.slice(prefix.length));
      }
    }
    return "";
  }

  function buildFbc(fbclid){
    if(!fbclid) return "";
    return "fb.1." + Math.floor(new Date(landingTime).getTime()) + "." + fbclid;
  }

  function renderQuestion(){
    const q = questions[step];
    kicker.textContent = "QUESTION " + (step + 1);
    title.textContent = q.title;
    caption.textContent = q.caption;
    stepNumber.textContent = (step + 1) + " / " + questions.length;
    progressBar.style.width = ((step + 1) / questions.length * 100) + "%";
    backButton.style.display = step > 0 ? "block" : "none";
    grid.innerHTML = "";
    q.options.forEach(option => {
      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = "<span>" + option + "</span><i>›</i>";
      button.addEventListener("click", () => selectAnswer(option));
      grid.appendChild(button);
    });
    questionBlock.style.animation = "none";
    requestAnimationFrame(() => { questionBlock.style.animation = "appear .28s ease both"; });
  }

  function selectAnswer(answer){
    const questionNumber = step + 1;
    if(!surveyStartedAt) surveyStartedAt = new Date().toISOString();
    if(!gaAnsweredSteps.has(questionNumber)){
      gaAnsweredSteps.add(questionNumber);
      trackGaEvent("diagnosis_answer", {
        question_number: String(questionNumber),
        answer_value: answer
      });
    }
    answers[step] = answer;
    step++;
    if(step < questions.length){
      renderQuestion();
    }else{
      showResult();
    }
  }

  function showResult(){
    surveyCompletedAt = new Date().toISOString();
    questionArea.style.display = "none";
    resultBlock.style.display = "block";
    answerSummary.innerHTML = "";
    answers.forEach(answer => {
      const span = document.createElement("span");
      span.textContent = answer;
      answerSummary.appendChild(span);
    });

    if(!diagnosisEventSent){
      diagnosisEventSent = true;
      trackMetaCustom("SalesPortDiagnosisComplete", {question_count: questions.length});
      trackGaEvent("diagnosis_complete", {question_count: questions.length});
    }
  }

  function buildCtaPayload(){
    const fbclid = query.get("fbclid") || "";
    const answerObject = {};
    answers.forEach((answer,index) => { answerObject["q" + (index + 1)] = answer; });

    return {
      type: "cta_touch",
      clickId: clickId,
      fbclid: fbclid,
      fbc: getCookie("_fbc") || buildFbc(fbclid),
      fbp: getCookie("_fbp"),
      ctaLocation: "diagnosis_result_cta",
      landingTime: landingTime,
      ctaTime: new Date().toISOString(),
      clientUserAgent: navigator.userAgent,
      utmCampaign: query.get("utm_campaign") || "",
      utmContent: query.get("utm_content") || "",
      utmTerm: query.get("utm_term") || "",
      campaignId: query.get("campaign_id") || "",
      adsetId: query.get("adset_id") || "",
      adId: query.get("ad_id") || "",
      placement: query.get("placement") || "",
      surveyStartedAt: surveyStartedAt,
      surveyCompletedAt: surveyCompletedAt,
      answers: answerObject
    };
  }

  function sendCtaTouch(payload){
    return fetch(GAS_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      headers: {"Content-Type":"text/plain;charset=UTF-8"},
      body: JSON.stringify(payload)
    }).catch(error => {
      console.error("SalesPort CTA save failed", error);
    });
  }

  backButton.addEventListener("click", () => {
    if(step > 0){
      step--;
      renderQuestion();
    }
  });

  startButton.addEventListener("click", () => {
    if(!surveyStartedAt) surveyStartedAt = new Date().toISOString();
    if(!diagnosisStartEventSent){
      diagnosisStartEventSent = true;
      trackGaEvent("diagnosis_start", {question_count: questions.length});
    }
    startBlock.style.display = "none";
    questionArea.style.display = "block";
    renderQuestion();
  });

  document.getElementById("restartButton").addEventListener("click", () => {
    step = 0;
    answers = [];
    surveyStartedAt = "";
    surveyCompletedAt = "";
    diagnosisEventSent = false;
    diagnosisStartEventSent = false;
    gaAnsweredSteps = new Set();
    resultBlock.style.display = "none";
    questionArea.style.display = "none";
    startBlock.style.display = "block";
    renderQuestion();
  });

  lineButton.addEventListener("click", event => {
    event.preventDefault();
    if(ctaSending) return;
    ctaSending = true;

    trackMetaCustom("SalesPortLineCtaClick", {cta_location:"diagnosis_result_cta"});
    trackGaEvent("line_click", {cta_location:"diagnosis_result_cta"});
    sendCtaTouch(buildCtaPayload());

    /* keepalive送信を開始してからLINEへ遷移する。 */
    window.setTimeout(() => {
      window.location.href = LINE_FRIEND_URL;
    }, 180);
  });

  renderQuestion();
</script>
</body>
</html>
